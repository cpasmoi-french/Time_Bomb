<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MLR TB - Online</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>
    <div id="toast-msg" class="hidden"></div>
    <div id="explosion-overlay"></div>

    <div id="game-over-screen" class="hidden">
        <h1 id="go-title">Victoire !</h1>
        <p id="go-desc">Raison</p>
        <div class="go-buttons">
            <button id="btn-replay" onclick="startGame()" style="display:none;">Rejouer</button>
            <button class="btn-alt" onclick="location.reload()">Quitter vers le Menu</button>
        </div>
    </div>

    <div id="menu-container">
        <h1>MLR 💣 TB</h1>
        
        <!-- Étape 1 : Choix simple -->
        <div id="initial-menu" class="panel">
            <input type="text" id="playerName" placeholder="Ton Pseudo" required><br>
            <button onclick="showSettingsMenu()">Créer une partie</button>
            <hr>
            <input type="text" id="roomCodeInput" placeholder="Code de la partie">
            <button onclick="joinGame()" class="btn-alt">Rejoindre</button>
        </div>

        <!-- Étape 2 : Paramètres de création -->
        <div id="creation-settings" class="panel" style="display:none;">
            <h3>Paramètres de la partie</h3>
            <div class="settings">
                <label>Total Joueurs : 
                    <input type="number" id="nbJoueurs" value="5" min="4" max="8" onchange="syncFromTotal()">
                </label>
                <label>Gentils : 
                    <input type="number" id="gentils" value="4" min="1" max="7" onchange="syncFromRoles('gentils')">
                </label>
                <label>Méchants : 
                    <input type="number" id="mechants" value="1" min="1" max="7" onchange="syncFromRoles('mechants')">
                </label>
                <label>Câbles à trouver : 
                    <input type="number" id="interrupteurs" value="5" min="1" max="10">
                </label>
            </div>
            <button onclick="createGame()">Valider et Créer</button>
            <button onclick="hideSettingsMenu()" class="btn-alt">Retour</button>
        </div>

        <!-- Étape 3 : Salle d'attente (Lobby) -->
        <div id="lobby" class="panel" style="display:none;">
            <h2>Code : <span id="displayRoomCode" class="highlight"></span></h2>
            <h3>Joueurs connectés :</h3>
            <ul id="playersList"></ul>
            <p id="waitingMessage">En attente de l'hôte pour lancer...</p>
            <button id="startBtn" onclick="startGame()" style="display:none;">Lancer la partie !</button>
        </div>
    </div>

    <div id="game-board" style="display:none;">
        <div id="center-table">
            <h2>Câbles à trouver</h2>
            <div id="slots-container"></div>
            <div id="turnIndicator">...</div>
        </div>
        <div id="players-area"></div>
        <div id="role-card-container" onclick="this.classList.toggle('active')">
            <div class="role-inner">
                <div class="role-front">Ton Rôle</div>
                <div class="role-back" id="myRoleCard"></div>
            </div>
        </div>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
