<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Bomb - Online</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>
    <!-- Ecran d'explosion (caché par défaut) -->
    <div id="explosion-overlay"></div>

    <div id="menu-container">
        <h1>💣 Désamorçage</h1>
        
        <div id="creation-form" class="panel">
            <input type="text" id="playerName" placeholder="Ton Pseudo" required><br>
            
            <h3>Créer une partie</h3>
            <div class="settings">
                <label>Gentils : <input type="number" id="gentils" value="5" min="1"></label>
                <label>Méchants : <input type="number" id="mechants" value="3" min="1"></label>
                <label>Interrupteurs : <input type="number" id="interrupteurs" value="5" min="1"></label>
            </div>
            <button onclick="createGame()">Créer la partie</button>
            
            <hr>
            <h3>Ou rejoindre</h3>
            <input type="text" id="roomCodeInput" placeholder="Code de la partie">
            <button onclick="joinGame()" class="btn-alt">Rejoindre</button>
        </div>

        <div id="lobby" class="panel" style="display:none;">
            <h2>Code de la partie : <span id="displayRoomCode" class="highlight"></span></h2>
            <h3>Joueurs connectés :</h3>
            <ul id="playersList"></ul>
            <p id="waitingMessage">En attente de l'hôte pour lancer...</p>
            <button id="startBtn" onclick="startGame()" style="display:none;">Lancer la partie !</button>
        </div>
    </div>

    <div id="game-board" style="display:none;">
        <!-- Centre de la table -->
        <div id="center-table">
            <h2>Câbles désamorcés</h2>
            <div id="cable-counter">0 / 5</div>
            <div id="turnIndicator">...</div>
        </div>

        <!-- Zone des joueurs -->
        <div id="players-area"></div>

        <!-- Carte Rôle dans le coin (PC & Mobile) -->
        <div id="role-card-container" onclick="this.classList.toggle('active')">
            <div class="role-inner">
                <div class="role-front">Ton Rôle<br><small>(Survole ou clique)</small></div>
                <div class="role-back" id="myRoleCard"></div>
            </div>
        </div>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
