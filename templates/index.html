<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Time Bomb - Online</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>
    <!-- Notifications (Toasts) et Animations -->
    <div id="toast-msg" class="hidden"></div>
    <div id="explosion-overlay"></div>

    <!-- Écran de Fin de Partie -->
    <div id="game-over-screen" class="hidden">
        <h1 id="go-title">Victoire !</h1>
        <p id="go-desc">Raison</p>
        <div class="go-buttons">
            <button id="btn-replay" onclick="startGame()" style="display:none;">Rejouer</button>
            <button class="btn-alt" onclick="location.reload()">Quitter vers le Menu</button>
        </div>
    </div>

    <div id="menu-container">
        <h1>💣 Désamorçage</h1>
        
        <div id="creation-form" class="panel">
            <input type="text" id="playerName" placeholder="Ton Pseudo" required><br>
            
            <h3>Créer une partie</h3>
            <div class="settings">
                <label>Nombre de joueurs (Total) : 
                    <input type="number" id="nbJoueurs" value="5" min="4" max="8" onchange="autoFillSettings()">
                </label>
                <div class="small-info">
                    <span id="infoGentils">3</span> Gentils | <span id="infoMechants">2</span> Méchants | <span id="infoInterrupteurs">5</span> Câbles
                </div>
                <!-- Inputs cachés envoyés au serveur -->
                <input type="hidden" id="gentils" value="3">
                <input type="hidden" id="mechants" value="2">
                <input type="hidden" id="interrupteurs" value="5">
            </div>
            <button onclick="createGame()">Créer la partie</button>
            
            <hr>
            <h3>Ou rejoindre</h3>
            <input type="text" id="roomCodeInput" placeholder="Code de la partie">
            <button onclick="joinGame()" class="btn-alt">Rejoindre</button>
        </div>

        <div id="lobby" class="panel" style="display:none;">
            <h2>Code de la partie : <span id="displayRoomCode" class="highlight"></span></h2>
            <h3>Joueurs connectés :</h3>
            <ul id="playersList"></ul>
            <p id="waitingMessage">En attente de l'hôte pour lancer...</p>
            <button id="startBtn" onclick="startGame()" style="display:none;">Lancer la partie !</button>
        </div>
    </div>

    <div id="game-board" style="display:none;">
        <div id="center-table">
            <h2>Câbles à trouver</h2>
            <div id="slots-container"></div>
            <div id="turnIndicator">...</div>
        </div>

        <div id="players-area"></div>

        <div id="role-card-container" onclick="this.classList.toggle('active')">
            <div class="role-inner">
                <div class="role-front">Ton Rôle</div>
                <div class="role-back" id="myRoleCard"></div>
            </div>
        </div>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
